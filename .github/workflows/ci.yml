name: CI

on:
    push:
        branches: [main]
    pull_request:
    # Reusable: release.yml calls this workflow for tag verification.
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    php-tests:
        # Matrix verified locally on 2026-11-18:
        #   testbench 9 => Laravel 11, testbench 10 => Laravel 12,
        #   testbench 11 => Laravel 13 (requires PHP ^8.3).
        # Laravel 11 is EOL: Composer >= 2.11 blocks its releases as
        # security-advisory-affected, hence COMPOSER_NO_SECURITY_BLOCKING
        # on the testbench ^9 legs only.
        name: PHP ${{ matrix.php }} / testbench ${{ matrix.testbench }} / ${{ matrix.stability }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']
                testbench: ['9', '10', '11']
                stability: ['stable', 'lowest']
                exclude:
                    # orchestra/testbench ^11 (Laravel 13) requires PHP ^8.3.
                    - php: '8.2'
                      testbench: '11'
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-${{ runner.os }}-${{ matrix.php }}-tb${{ matrix.testbench }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-
            - name: Install dependencies
              env:
                  COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.testbench == '9' && '1' || '0' }}
              run: |
                  composer require "orchestra/testbench:^${{ matrix.testbench }}" --no-interaction --no-update
                  composer update --prefer-stable ${{ matrix.stability == 'lowest' && '--prefer-lowest' || '' }} --prefer-dist --no-interaction
            - run: composer test

    php-static:
        name: Lint & static analysis
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-${{ runner.os }}-8.4-static-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-8.4-
            - run: composer update --prefer-stable --prefer-dist --no-interaction
            - run: composer lint
            - run: composer analyse

    js:
        name: JS (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        defaults:
            run:
                working-directory: js
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
                  cache-dependency-path: js/package-lock.json
            - run: npm ci
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: npm run test:package

    emulator:
        name: Emulator (PHP 8.4 + Node 24)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: js/package-lock.json
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-${{ runner.os }}-8.4-emulator-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-8.4-
            - run: composer update --prefer-stable --prefer-dist --no-interaction
            - run: npm --prefix js ci
            - name: Start the AWS emulator
              run: tests/emulator/start.sh
            - name: PHP emulator tests
              env:
                  EMULATOR_REQUIRED: '1'
              run: composer test:emulator
            - name: JS emulator tests
              env:
                  EMULATOR_REQUIRED: '1'
              run: npm --prefix js run test:emulator
            - name: Stop the emulator
              if: always()
              run: tests/emulator/stop.sh
            - name: Collect emulator logs
              if: failure()
              run: docker logs laravel-appsync-events-emulator > emulator-logs.txt 2>&1 || true
            - name: Upload emulator logs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: emulator-logs
                  path: emulator-logs.txt
                  if-no-files-found: ignore
