# Release pipeline for tags vX.Y.Z (and manual dry-run rehearsals).
#
# No Packagist job is needed: once the package is registered on Packagist,
# the Packagist GitHub integration publishes new tags automatically.
#
# npm is published via trusted publishing (OIDC) — no long-lived token.
# The trusted publisher on npmjs.com must point at this repository and
# this workflow file (release.yml), with no environment. The package must
# already exist on npm (publish the very first version manually, see
# CONTRIBUTING.md); the job below skips versions that are already
# published, so re-running a tag is safe.

name: Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+*'
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Rehearse the release without publishing (npm --dry-run, no GitHub release)'
                type: boolean
                default: true

permissions:
    contents: read

jobs:
    verify:
        name: Verify version
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - run: composer validate --strict
            - name: Check the tag matches js/package.json
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./js/package.json').version")"
                  if [ "$tag" != "$pkg" ]; then
                      echo "::error::Tag ${GITHUB_REF_NAME} does not match js/package.json version ${pkg}. Bump it first (npm version <x.y.z> --no-git-tag-version in js/)."
                      exit 1
                  fi
                  echo "Tag ${GITHUB_REF_NAME} matches js/package.json ${pkg}."
            - name: Extract release notes for the tag
              run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" CHANGELOG.md > release-notes.md && head -20 release-notes.md

    tests:
        name: Test suite
        needs: verify
        uses: ./.github/workflows/ci.yml

    npm-publish:
        name: Publish npm package
        needs: tests
        permissions:
            contents: read
            id-token: write # npm trusted publishing (OIDC) + provenance
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: js
        steps:
            - uses: actions/checkout@v4
            # setup-node v5: `package-manager-cache` is not an input on v4.
            # Release builds never use caches (npm trusted publishing docs).
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - name: Check whether the version is already published
              id: published
              run: |
                  name="$(node -p "require('./package.json').name")"
                  version="$(node -p "require('./package.json').version")"
                  if npm view "${name}@${version}" version > /dev/null 2>&1; then
                      echo "::notice::${name}@${version} already exists on npm; skipping build and publish."
                      echo "already_published=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "already_published=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Ensure npm >= 11.5.1 for trusted publishing
              if: steps.published.outputs.already_published != 'true'
              run: |
                  # Trusted publishing requires npm >= 11.5.1; upgrade if the
                  # Node 24 bundled npm is older, then enforce the minimum.
                  is_supported='const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&b>5)||(a===11&&b===5&&c>=1)?0:1)'
                  node -e "$is_supported" "$(npm -v)" || npm install -g "npm@^11.5.1"
                  if ! node -e "$is_supported" "$(npm -v)"; then
                      echo "::error::npm $(npm -v) is below 11.5.1, the minimum required for trusted publishing."
                      exit 1
                  fi
                  echo "npm $(npm -v) satisfies the trusted publishing minimum."
            - name: Install dependencies
              if: steps.published.outputs.already_published != 'true'
              run: npm ci
            - name: Build
              if: steps.published.outputs.already_published != 'true'
              run: npm run build
            - name: Publish (dry run)
              if: ${{ steps.published.outputs.already_published != 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
              run: npm publish --dry-run --access public
            - name: Publish to npm
              if: ${{ steps.published.outputs.already_published != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
              run: npm publish --access public

    github-release:
        name: GitHub release
        needs: tests
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Extract release notes
              run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" CHANGELOG.md > release-notes.md
            - name: Create GitHub release
              if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release create "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
