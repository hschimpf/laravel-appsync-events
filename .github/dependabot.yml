version: 2

updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          composer-minor-patch:
              update-types: [minor, patch]
      commit-message:
          prefix: build(deps)

    - package-ecosystem: npm
      directory: /js
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      # tsup builds declarations through the TypeScript 6 compiler API;
      # typescript 7.x breaks the dts build until tsup supports it.
      ignore:
          - dependency-name: typescript
            update-types: [version-update:semver-major]
      groups:
          npm-minor-patch:
              update-types: [minor, patch]
      commit-message:
          prefix: build(js-deps)

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          actions:
              patterns: ['*']
      commit-message:
          prefix: ci(deps)
